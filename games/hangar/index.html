function sec(legId,n=10,maxOpt=4){
  const now=dayNum(today());const L=leg(legId);
  let out=bank(legId).map(q=>({q,p:oncelik(q,now)})).sort((a,b)=>b.p-a.p).map(x=>x.q).slice(0,n);
  const R=rota();
  if(R&&R.pay&&legId!==R.rota&&legId!=='odev'){const m=Math.max(1,Math.round(n*R.pay));
    const ek=bank(R.rota).map(q=>({q,p:oncelik(q,now)})).sort((a,b)=>b.p-a.p).map(x=>x.q).slice(0,m);out=out.slice(0,n-ek.length).concat(ek)}

  if(!S.gorev.odul&&S.gorev.yapilan>=S.gorev.hedef){S.gorev.odul=true;S.xp+=100;window.Ortak.olay&&window.Ortak.olay('gorev')}}
function durum(){const t=today();const g=S.gorev.gun===t?S.gorev:{yapilan:0,hedef:15,odul:false};
  const l=seviye();return{xp:S.xp,seviye:l,rutbe:RUTBE[Math.min(l-1,RUTBE.length-1)],ilerleme:(S.xp%150)/150,seri:S.seri.gun&&dayNum(t)-dayNum(S.seri.gun)<=1?S.seri.say:0,gorev:g,toplamDogru:S.toplamDogru,usta:S.usta.length,sure:sureDurum()}}
function ozetHTML(){const d=durum();const dk=Math.floor(d.sure.sn/60);return `<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:13px;margin:6px 0">
  <span style="background:#10223f;color:#ffc23d;border-radius:99px;padding:4px 10px">Sv ${d.seviye} · ${d.rutbe}</span>
  <span style="background:#ff7a3d;color:#fff;border-radius:99px;padding:4px 10px">🔥 ${d.seri} gün</span>
  <span style="background:${d.gorev.odul?'#1fa35b':'#3b82f6'};color:#fff;border-radius:99px;padding:4px 10px">🎯 ${Math.min(d.gorev.yapilan,d.gorev.hedef)}/${d.gorev.hedef}${d.gorev.odul?' ✓':''}</span>
  <span style="background:#7c3aed;color:#fff;border-radius:99px;padding:4px 10px">🏅 ${d.usta} ustalık</span>
  <span style="background:#64748b;color:#fff;border-radius:99px;padding:4px 10px">⏱️ ${dk}/20 dk</span></div>`}

// ---------- Ses ve müzik (WebAudio, dosya yok) ----------
let ctx=null,master=null,muzikT=null;
function ac(){try{if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=S.sessiz?0:1;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume()}catch(e){}sureBasla();return ctx}
function nota(f,t,d,tip='square',v=.08){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=tip;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.02)}
function davul(t,tip){if(!ctx)return;const len=tip==='k'?.18:.06;const b=ctx.createBuffer(1,ctx.sampleRate*len,ctx.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(tip==='k'?Math.sin(i/ctx.sampleRate*2*Math.PI*(120-i/d.length*80)):Math.random()*2-1)*(1-i/d.length);
  const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=b;g.gain.value=tip==='k'?.35:.06;s.connect(g).connect(master);s.start(t)}
const hz=m=>440*2**((m-69)/12);
const TEMALAR={gok:{bpm:112,kok:[60,57,65,67],mel:[0,2,4,7,9,12]},kosu:{bpm:140,kok:[57,53,55,52],mel:[0,3,5,7,10,12]},uzay:{bpm:96,kok:[62,58,60,57],mel:[0,2,3,7,9,12]}};
function muzik(tema='gok'){ac();if(!ctx)return;muzikDur();const T=TEMALAR[tema]||TEMALAR.gok;const adim=60/T.bpm/2;let n=0;let t0=ctx.currentTime+.1;
  let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const melodi=Array.from({length:32},()=>rnd()<.7?T.mel[Math.floor(rnd()*T.mel.length)]:null);
  const zamanla=()=>{while(t0<ctx.currentTime+.6){const bar=Math.floor(n/8)%4,s=n%8;const kok=T.kok[bar];
      if(s%4===0)davul(t0,'k');if(s%4===2)davul(t0,'h');
      if(s%2===0)nota(hz(kok-24),t0,adim*1.8,'triangle',.12);
      const m=melodi[n%32];if(m!==null)nota(hz(kok+m+(bar%2?0:12)),t0,adim*.9,'square',.035);
      n++;t0+=adim}};
  zamanla();muzikT=setInterval(zamanla,200)}
function muzikDur(){clearInterval(muzikT);muzikT=null}
const SES={
  dogru(){ac();const t=ctx&&ctx.currentTime;[784,988,1319].forEach((f,i)=>nota(f,t+i*.07,.15,'square',.07))},
  yanlis(){ac();const t=ctx&&ctx.currentTime;nota(220,t,.25,'sawtooth',.08);nota(165,t+.12,.3,'sawtooth',.08)},
  ipucu(){ac();const t=ctx&&ctx.currentTime;nota(660,t,.12,'triangle',.07);nota(880,t+.1,.12,'triangle',.07)},
  altin(){ac();const t=ctx&&ctx.currentTime;nota(1319,t,.06,'square',.05);nota(1760,t+.05,.1,'square',.05)},
  zafer(){ac();const t=ctx&&ctx.currentTime;[523,659,784,1047,784,1047,1319].forEach((f,i)=>nota(f,t+i*.11,.2,'square',.07))},
  zipla(){ac();const t=ctx&&ctx.currentTime;if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(700,t+.15);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(master);o.start(t);o.stop(t+.2)},
};
function sessiz(v){if(v===undefined)return S.sessiz;S.sessiz=v;save();if(master)master.gain.value=v?0:1}
function veri(){return S}
function tasarim(x){if(x){S.tasarim=x;save()}return S.tasarim||null}
// Ustalık ödülleri: her ustalaşılan kazanım yeni parça açar
const ODULLER=[[0,'Gövde rengi'],[1,'Kanat rengi'],[2,'Şerit deseni'],[3,'Kuyruk numarası'],[4,'Kanat ucu (winglet)'],[6,'Jet motoru'],[8,'Boss tasarımı'],[10,'Altın kaplama']];
function acik(ad){const u=(S.usta||[]).length;const o=ODULLER.find(x=>x[1]===ad);return o?u>=o[0]:false}
function veriYukle(x){if(x&&x.v===1&&(x.guncel||0)>(S.guncel||0)){S=Object.assign(bos(),x);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return true}return false}

window.Ortak={tasarim,acik,ODULLER,rota,sec,kirp,kaydet,uret,xp,durum,ozetHTML,muzik,muzikDur,SES,sessiz,ac,bugun:today,olay:null,geriBildirim,acikKontrol,sureDurum,sureKapisi,veri,veriYukle,bulut:null,_bitti:false};
})();

// ---------- Bulut eşitleme (yalnız kişisel sürüm; genel sürümde window.BULUT yok → hiçbir veri gönderilmez) ----------
(function(){
  const B=window.BULUT;if(!B||!B.url||!B.key||!B.profil||typeof fetch!=='function')return;
  const rpc=(fn,body)=>fetch(`${B.url}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:B.key,Authorization:'Bearer '+B.key,'Content-Type':'application/json','Content-Profile':'api','Accept-Profile':'api'},body:JSON.stringify(body)}).then(r=>r.ok?r.json():Promise.reject(r.status));
  let zam=null,son=null;
  window.Ortak.bulut={
    yaz(S){son=S;clearTimeout(zam);zam=setTimeout(()=>{const v={...son};rpc('oyun_kaydet',{p_profil:B.profil,p_veri:v}).catch(()=>{})},4000)},
    oku(){return rpc('oyun_oku',{p_profil:B.profil}).then(r=>{if(r&&r.veri){const ok=window.Ortak.veriYukle({...r.veri,guncel:Date.parse(r.guncel)});if(ok&&window.Ortak.olay)window.Ortak.olay('bulut','yuklendi');return ok}return false}).catch(()=>false)}
  };
  window.Ortak.bulut.oku();
})();
/*</BULUT>*/

const $=id=>document.getElementById(id);
const RENKLER=['#e2463b','#3b82f6','#1fa35b','#ffc23d','#7c3aed','#ff7a1a','#10223f','#ffffff','#9aa3b2','#ec4899'];
const VARSAYILAN={govde:'#ffffff',kanat:'#3b82f6',serit:'tek',seritRenk:'#e2463b',no:'TC-001',winglet:false,motor:'pervane',altin:false,boss:{n:'Profesör Unutkan',e:'🤖',renk:'#7c3aed'}};
let T=Object.assign({},VARSAYILAN,Ortak.tasarim()||{});T.boss=Object.assign({},VARSAYILAN.boss,T.boss||{});
let sekme='ucak';

// ---------- 3B önizleme ----------
const cv=$('sahne');const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene();const cam=new THREE.PerspectiveCamera(40,1,.1,100);cam.position.set(4.2,2.6,5.4);cam.lookAt(0,0,0);
sc.add(new THREE.HemisphereLight(0xffffff,0x6688aa,1));const gun=new THREE.DirectionalLight(0xffffff,.7);gun.position.set(3,6,4);sc.add(gun);
function boyut(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',boyut);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:T.altin?.7:.1});
function ucakYap(baski){
  const g=new THREE.Group();const govdeR=T.altin?'#d4a017':T.govde;
  const G=new THREE.Mesh(new THREE.CylinderGeometry(.34,.28,3.2,24),M(govdeR));G.rotation.x=Math.PI/2;g.add(G);
  const burun=new THREE.Mesh(new THREE.SphereGeometry(.34,24,16,0,Math.PI*2,0,Math.PI/2),M(govdeR));burun.rotation.x=-Math.PI/2;burun.position.z=-1.6;g.add(burun);
  const kuyrukUc=new THREE.Mesh(new THREE.ConeGeometry(.28,.6,24),M(govdeR));kuyrukUc.rotation.x=Math.PI/2;kuyrukUc.position.z=1.9;g.add(kuyrukUc);
  const kt=baski?.07:.06;// baskıda kanat kalınlığı ≥ 2,4 mm (12 cm ölçekte)
  const kanat=new THREE.Mesh(new THREE.BoxGeometry(4.4,kt,.9),M(T.kanat));kanat.position.set(0,-.08,-.1);g.add(kanat);
  const yatay=new THREE.Mesh(new THREE.BoxGeometry(1.6,kt,.5),M(T.kanat));yatay.position.set(0,.05,1.75);g.add(yatay);
  const dikey=new THREE.Mesh(new THREE.BoxGeometry(kt,.8,.55),M(T.kanat));dikey.position.set(0,.45,1.75);g.add(dikey);
  if(T.winglet){[-1,1].forEach(s=>{const w=new THREE.Mesh(new THREE.BoxGeometry(kt,.35,.4),M(T.kanat));w.position.set(s*2.2,.08,-.05);g.add(w)})}
  if(T.motor==='jet'){[-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.CylinderGeometry(.16,.14,.6,16),M('#9aa3b2'));e.rotation.x=Math.PI/2;e.position.set(s*1.1,-.3,-.25);g.add(e)})}
  else if(!baski){const p=new THREE.Mesh(new THREE.BoxGeometry(.9,.08,.04),M('#23324d'));p.position.z=-1.95;p.name='pervane';g.add(p)}
  if(T.serit!=='yok'&&!baski){const n=T.serit==='cift'?2:1;for(let i=0;i<n;i++){const s=new THREE.Mesh(new THREE.CylinderGeometry(.345,.335,.18,24),M(T.seritRenk));s.rotation.x=Math.PI/2;s.position.z=-.6+i*.35;g.add(s)}}
  if(!baski&&T.no){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.fillStyle='#10223f';x.font='bold 44px sans-serif';x.textAlign='center';x.fillText(T.no,128,48);
    const tx=new THREE.CanvasTexture(c);[-1,1].forEach(s=>{const pl=new THREE.Mesh(new THREE.PlaneGeometry(.5,.13),new THREE.MeshBasicMaterial({map:tx,transparent:true}));pl.position.set(s*.036,.5,1.75);pl.rotation.y=s*Math.PI/2;g.add(pl)})}
  return g;
}
function bossYap(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),M(T.boss.renk));g.add(b);
  [-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),M('#ffffff'));e.position.set(s*.38,.25,.85);g.add(e);const p=new THREE.Mesh(new THREE.SphereGeometry(.1,12,8),M('#10223f'));p.position.set(s*.38,.25,1.05);g.add(p)});
  const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');x.font='96px sans-serif';x.textAlign='center';x.fillText(T.boss.e,64,100);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));sp.position.y=1.5;sp.scale.set(.9,.9,.9);g.add(sp);return g}
let model=null;function yenile(){if(model)sc.remove(model);model=sekme==='ucak'?ucakYap(false):bossYap();sc.add(model);panel()}
let t0=performance.now();(function dong(t){const dt=(t-t0)/1000;t0=t;if(model){model.rotation.y+=dt*.5;const p=model.getObjectByName('pervane');if(p)p.rotation.z+=dt*25}R.render(sc,cam);requestAnimationFrame(dong)})(t0);

// ---------- Panel ----------
const kilitli=ad=>!Ortak.acik(ad);
const etiket=ad=>{const o=Ortak.ODULLER.find(x=>x[1]===ad);return kilitli(ad)?`<small>🔒 ${o[0]} ustalık</small>`:''};
const renkler=(alan,ad,deger)=>`<div class="renk ${kilitli(ad)?'kilit':''}">${RENKLER.map(c=>`<button style="background:${c}" data-renk="${alan}" data-c="${c}" aria-label="${c}" aria-pressed="${deger===c}"></button>`).join('')}</div>`;
function panel(){
  if(sekme==='ucak'){$('panel').innerHTML=`
   <h2>Gövde ${etiket('Gövde rengi')}</h2>${renkler('govde','Gövde rengi',T.govde)}
   <h2>Kanat ve kuyruk ${etiket('Kanat rengi')}</h2>${renkler('kanat','Kanat rengi',T.kanat)}
   <h2>Şerit ${etiket('Şerit deseni')}</h2><div class="secenek ${kilitli('Şerit deseni')?'kilit':''}">${[['yok','Yok'],['tek','Tek'],['cift','Çift']].map(([v,l])=>`<button data-serit="${v}" aria-pressed="${T.serit===v}">${l}</button>`).join('')}</div>
   ${kilitli('Şerit deseni')?'':renkler('seritRenk','Şerit deseni',T.seritRenk)}
   <h2>Kuyruk numarası ${etiket('Kuyruk numarası')}</h2><input type="text" id="no" maxlength="8" value="${T.no}" ${kilitli('Kuyruk numarası')?'disabled':''}>
   <h2>Kanat ucu ${etiket('Kanat ucu (winglet)')}</h2><div class="secenek ${kilitli('Kanat ucu (winglet)')?'kilit':''}"><button data-wing="0" aria-pressed="${!T.winglet}">Düz</button><button data-wing="1" aria-pressed="${T.winglet}">Winglet</button></div>
   <h2>Motor ${etiket('Jet motoru')}</h2><div class="secenek ${kilitli('Jet motoru')?'kilit':''}"><button data-motor="pervane" aria-pressed="${T.motor==='pervane'}">Pervane</button><button data-motor="jet" aria-pressed="${T.motor==='jet'}">2 jet motoru</button></div>
   <h2>Altın kaplama ${etiket('Altın kaplama')}</h2><div class="secenek ${kilitli('Altın kaplama')?'kilit':''}"><button data-altin="0" aria-pressed="${!T.altin}">Kapalı</button><button data-altin="1" aria-pressed="${T.altin}">✨ Altın</button></div>`}
  else{const k=kilitli('Boss tasarımı');$('panel').innerHTML=`
   <h2>Boss'unun adı ${etiket('Boss tasarımı')}</h2><input type="text" id="bossAd" maxlength="20" value="${T.boss.n}" ${k?'disabled':''}>
   <h2>Görünüş</h2><div class="secenek emoji ${k?'kilit':''}">${['🤖','👾','🐉','🦖','👻','🧟','🦑','🌋'].map(e=>`<button data-emoji="${e}" aria-pressed="${T.boss.e===e}">${e}</button>`).join('')}</div>
   <h2>Rengi</h2>${renkler('boss','Boss tasarımı',T.boss.renk)}
   <p class="not">Kendi boss'un sınav günlerinde Dünya Turu'nda karşına çıkar.</p>`}
  const u=Ortak.durum().usta;$('usta').textContent=`🏅 ${u}`;
  const sonraki=Ortak.ODULLER.find(o=>o[0]>u);$('odul').innerHTML=sonraki?`Sıradaki ödül: <b>${sonraki[1]}</b> (${sonraki[0]} ustalık). Bir kazanımda üst üste 5 soruyu ilk denemede doğru yapınca 1 ustalık kazanırsın.`:'Tüm parçaları açtın! 🏆'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.renk){if(d.renk==='boss')T.boss.renk=d.c;else T[d.renk]=d.c}else if(d.serit)T.serit=d.serit;else if(d.wing)T.winglet=d.wing==='1';else if(d.motor)T.motor=d.motor;else if(d.altin)T.altin=d.altin==='1';else if(d.emoji)T.boss.e=d.emoji;else return;yenile()});
document.addEventListener('input',e=>{if(e.target.id==='no'){T.no=e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g,'');yenile()}if(e.target.id==='bossAd'){T.boss.n=e.target.value.replace(/[<>]/g,'')}});
$('tUcak').onclick=()=>{sekme='ucak';$('tUcak').setAttribute('aria-pressed','true');$('tBoss').setAttribute('aria-pressed','false');yenile()};
$('tBoss').onclick=()=>{sekme='boss';$('tBoss').setAttribute('aria-pressed','true');$('tUcak').setAttribute('aria-pressed','false');yenile()};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2500)}
$('kaydet').onclick=()=>{Ortak.tasarim(JSON.parse(JSON.stringify(T)));Ortak.SES&&Ortak.SES.dogru&&Ortak.SES.dogru();toast('Kaydedildi! Oyunlarda bu uçakla uçacaksın ✈️')};
$('stl').onclick=()=>{const m=ucakYap(true);m.scale.setScalar(120/4.4);m.updateMatrixWorld(true);// 4,4 birim kanat = 120 mm
  const veri=new THREE.STLExporter().parse(m,{binary:true});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([veri],{type:'model/stl'}));a.download=`ucagim-${(T.no||'ucak').toLowerCase()}.stl`;a.click();toast('STL hazır. Baskıdan önce kontrol ettirelim!')};
boyut();yenile();
</script>
