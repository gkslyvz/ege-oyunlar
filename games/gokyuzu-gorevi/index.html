<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilot Ege: Gökyüzü Görevi</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#0b3d91; --sky2:#3b8fe0; --sky3:#a9dcff;
    --ink:#10223f; --card:#ffffff; --ok:#1fa35b; --bad:#e2463b; --gold:#ffc23d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%);
    min-height:100%;overflow-x:hidden;
  }
  body.space{background:linear-gradient(180deg,#05061a 0%,#141a4a 55%,#2b3a8f 100%)}
  .clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .cloud{position:absolute;background:#fff;border-radius:60px;opacity:.55;animation:drift linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:55%;height:140%;left:12%;top:-55%}
  .cloud::after{width:40%;height:110%;right:12%;top:-35%}
  body.space .cloud{display:none}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;display:none}
  body.space .stars{display:block}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 2s ease-in-out infinite}
  @keyframes tw{50%{opacity:.2}}
  @keyframes drift{from{transform:translateX(110vw)}to{transform:translateX(-40vw)}}
  main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 40px}
  h1{color:#fff;font-size:34px;line-height:1.05;margin:8px 0 2px;text-shadow:0 3px 0 rgba(0,0,0,.18)}
  .sub{color:#e6f3ff;margin:0 0 16px;font-size:17px}
  .card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(6,30,70,.25)}
  .hidden{display:none!important}

  /* Harita */
  .legs{display:grid;gap:12px}
  .leg{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:#fff;border:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(6,30,70,.18);transition:transform .12s}
  .leg:active{transform:scale(.98)}
  .leg .ico{font-size:34px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:#eaf4ff;flex:none}
  .leg .t{font-weight:800;font-size:19px;line-height:1.1}
  .leg .d{font-size:14px;color:#4a5d7c}
  .leg .st{margin-left:auto;font-size:20px;letter-spacing:1px;white-space:nowrap}
  .leg.locked{opacity:.55;cursor:not-allowed}
  .badge{display:inline-block;font-size:12px;font-weight:700;background:#eaf4ff;color:#1c4f9c;padding:2px 8px;border-radius:999px;margin-top:3px}
  .passport{margin-top:16px;color:#fff;font-size:15px;text-align:center}
  .linkbtn{background:none;border:none;color:#dcebff;text-decoration:underline;font:inherit;cursor:pointer;margin-top:6px}

  /* Uçuş */
  .hud{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:700;margin-bottom:8px;gap:8px}
  .hud button{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:12px;padding:6px 12px;font:inherit;cursor:pointer}
  .route{position:relative;height:96px;margin:4px 0 14px}
  .route .line{position:absolute;left:34px;right:34px;top:54px;border-top:4px dashed rgba(255,255,255,.75)}
  .route .city{position:absolute;top:66px;color:#fff;font-weight:700;font-size:14px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .route .city.a{left:0}.route .city.b{right:0;text-align:right}
  .route .pin{position:absolute;top:44px;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--gold)}
  .route .pin.a{left:24px}.route .pin.b{right:24px}
  .plane{position:absolute;top:14px;left:20px;width:76px;height:46px;transition:left .8s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 60%}
  .plane.shake{animation:shake .6s}
  @keyframes shake{20%{transform:translate(-3px,6px) rotate(-6deg)}40%{transform:translate(3px,-5px) rotate(5deg)}60%{transform:translate(-2px,4px) rotate(-4deg)}80%{transform:translate(2px,-2px) rotate(2deg)}}
  .plane.bob{animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px)}}

  .qmeta{display:flex;justify-content:space-between;font-size:14px;color:#4a5d7c;font-weight:700}
  .q{font-size:23px;font-weight:800;line-height:1.25;margin:8px 0 14px}
  .opts{display:grid;gap:10px}
  .opt{font:inherit;font-size:19px;font-weight:700;text-align:left;padding:13px 16px;border-radius:16px;border:3px solid #d6e6fb;background:#f6faff;color:var(--ink);cursor:pointer;transition:transform .1s}
  .opt:active{transform:scale(.98)}
  .opt.right{background:#e3f8ec;border-color:var(--ok)}
  .opt.wrong{background:#fde8e6;border-color:var(--bad)}
  .opt:disabled{cursor:default}
  .fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:17px;line-height:1.35}
  .fb.ok{background:#e3f8ec}
  .fb.no{background:#fff1d6}
  .fb b{display:block;font-size:19px}
  .next{margin-top:14px;width:100%;font:inherit;font-size:21px;font-weight:800;padding:14px;border:none;border-radius:16px;background:var(--gold);color:#3b2a00;cursor:pointer;box-shadow:0 5px 0 #d99a12}
  .next:active{transform:translateY(3px);box-shadow:0 2px 0 #d99a12}
  .combo{color:#fff;text-align:center;font-weight:800;min-height:24px;margin-top:10px;font-size:17px}

  /* Sonuç */
  .stamp{width:150px;height:150px;margin:6px auto 10px;border-radius:50%;border:6px double #c0392b;color:#c0392b;display:grid;place-items:center;text-align:center;font-weight:800;font-size:18px;line-height:1.05;transform:rotate(-12deg);animation:stamp .5s ease-out}
  @keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
  .center{text-align:center}
  .big{font-size:42px;letter-spacing:4px}
  .confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:5;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .small{font-size:14px;color:#4a5d7c}
  .review{margin-top:10px;text-align:left;font-size:15px}
  .review li{margin-bottom:4px}
</style>
</head>
<body>
<div class="clouds" id="clouds"></div>
<div class="stars" id="stars"></div>
<main>

  <!-- HARİTA -->
  <section id="map">
    <h1>✈️ Pilot Ege<br>Gökyüzü Görevi</h1>
    <p class="sub">Her doğru cevap uçağını ileri götürür. Rotayı tamamla, pasaportuna damga al!</p>
    <div class="legs" id="legs"></div>
    <div class="passport" id="passport"></div>
    <div class="center"><button class="linkbtn" id="reset">İlerlemeyi sıfırla</button></div>
  </section>

  <!-- UÇUŞ -->
  <section id="flight" class="hidden">
    <div class="hud">
      <button id="back">← Harita</button>
      <span id="legTitle"></span>
      <span id="fuel"></span>
    </div>
    <div class="route">
      <div class="line"></div>
      <div class="pin a"></div><div class="pin b"></div>
      <div class="city a" id="cityA"></div><div class="city b" id="cityB"></div>
      <svg class="plane bob" id="plane" viewBox="0 0 76 46" aria-hidden="true"></svg>
    </div>
    <div class="card">
      <div class="qmeta"><span id="qTopic"></span><span id="qCount"></span></div>
      <div class="q" id="qText"></div>
      <div class="opts" id="opts"></div>
      <div id="fb"></div>
      <button class="next hidden" id="nextBtn">Devam ✈️</button>
    </div>
    <div class="combo" id="combo"></div>
  </section>

  <!-- SONUÇ -->
  <section id="done" class="hidden">
    <div class="card center">
      <div class="stamp" id="stamp"></div>
      <div class="big" id="stars3"></div>
      <h2 id="doneTitle" style="margin:6px 0"></h2>
      <p id="doneText" class="small"></p>
      <div id="doneReview"></div>
      <button class="next" id="toMap">Haritaya dön</button>
    </div>
  </section>
</main>

<script>
// ===== SORU BANKASI =====
// Türkçe soruları Ege Pano'daki TİS-1 tekrar kartlarından; Matematik ve Fen soruları
// pano'daki konu başlıklarından (Açılar, Çokgenler, Ay, Dünyamız) 5. sınıf düzeyinde yazıldı.
const LEGS = [{"id":"tr","title":"İstanbul → Londra","ders":"Türkçe","icon":"📘","to":"Londra","vehicle":"plane","qs":[{"t":"Eş anlam","q":"\"Yanıt\" sözcüğünün eş anlamlısı hangisi?","o":["Cevap","Soru","Sonuç","Anlam"],"a":0,"e":"Yanıt = Cevap. Aynı anlama gelen farklı sözcüklere eş anlamlı denir."},{"t":"Eş anlam","q":"\"Kara\" sözcüğünün eş anlamlısı hangisi?","o":["Beyaz","Siyah","Koyu yeşil","Toprak"],"a":1,"e":"Kara = Siyah. (Beyaz ise zıt anlamlısıdır.)"},{"t":"Deyimler","q":"\"Göz atmak\" deyimi ne anlama gelir?","o":["Bir şeye kısaca, üstünkörü bakmak","Göze bir şey kaçmak","Çok uykusu gelmek","Birine kızmak"],"a":0,"e":"Göz atmak: bir şeye kısaca, şöyle bir bakmak."},{"t":"Deyimler","q":"\"Etekleri zil çalmak\" ne demektir?","o":["Çok korkmak","Çok sevinmek","Çok yorulmak","Çok acıkmak"],"a":1,"e":"Etekleri zil çalmak: çok sevinmek, sevinçten yerinde duramamak."},{"t":"Atasözleri","q":"\"Damlaya damlaya göl olur\" atasözü ne anlatır?","o":["Yağmur çok yağınca göl oluşur","Küçük birikimler zamanla büyük sonuç oluşturur","Su israf edilmemeli","Göller yavaş dolar"],"a":1,"e":"Azar azar biriken şeyler zamanla büyür. Her gün biraz çalışmak da böyledir!"},{"t":"İkileme","q":"\"Çocuklar koşa koşa eve geldi.\" cümlesindeki ikileme hangisi?","o":["Çocuklar","eve geldi","koşa koşa","geldi"],"a":2,"e":"Aynı sözcüğün tekrar edilmesi ikilemedir: koşa koşa."},{"t":"İkileme","q":"Hangisi bir ikilemedir?","o":["yavaş yavaş","masmavi","kırmızı elma","hızlı koştu"],"a":0,"e":"\"Yavaş yavaş\" ikilemedir. \"Masmavi\" ise pekiştirmedir."},{"t":"Pekiştirme","q":"\"Kıpkırmızı\" hangi sözcüğün pekiştirilmiş hâlidir?","o":["kırık","kırmızı","kıpır","kırk"],"a":1,"e":"Kıp + kırmızı = kıpkırmızı. Anlamı güçlendirir."},{"t":"Pekiştirme","q":"Hangisi pekiştirmeli bir sözcüktür?","o":["ağır ağır","masmavi","gide gide","mavi gök"],"a":1,"e":"Mas + mavi = masmavi. \"Ağır ağır\" ve \"gide gide\" ikilemedir."},{"t":"Hikâyenin unsurları","q":"Hikâyenin dört temel unsuru hangisidir?","o":["Giriş, gelişme, sonuç, başlık","Kişi, zaman, yer, olay","Yazar, kitap, sayfa, kapak","Soru, cevap, özet, ana fikir"],"a":1,"e":"Hikâyenin unsurları: kişi (kahraman), zaman, yer, olay."},{"t":"Büyük harf","q":"Hangisi doğru yazılmıştır?","o":["ege Ankara'ya gitti.","Ege ankara'ya gitti.","Ege Ankara'ya gitti.","ege ankara'ya gitti."],"a":2,"e":"Cümle büyük harfle başlar; kişi ve şehir adları büyük harfle yazılır."},{"t":"Noktanın kullanımı","q":"Tarih hangi seçenekte doğru yazılmıştır?","o":["10,11,2026","10.11.2026","10;11;2026","10:11:2026"],"a":1,"e":"Tarihte gün, ay ve yıl arasına nokta konabilir: 10.11.2026"},{"t":"Sözcükte anlam","q":"\"Arkadaşına sert bir cevap verdi.\" cümlesinde \"sert\" hangi anlamda?","o":["Gerçek anlam","Mecaz anlam"],"a":1,"e":"Cevabın dokunulacak bir sertliği yoktur; burada \"kırıcı\" anlamında, yani mecaz."},{"t":"Sözcükte anlam","q":"\"Bu taş çok sert.\" cümlesinde \"sert\" hangi anlamda?","o":["Gerçek anlam","Mecaz anlam"],"a":0,"e":"Taş elle dokununca gerçekten serttir: gerçek anlam."},{"t":"Zıt anlam","q":"\"Cesur\" sözcüğünün zıt anlamlısı hangisi?","o":["Korkak","Güçlü","Akıllı","Hızlı"],"a":0,"e":"Cesur ↔ korkak. Zıt anlamlılar birbirinin tersini anlatır."},{"t":"Zıt anlam","q":"\"Uzak\" sözcüğünün zıt anlamlısı hangisi?","o":["Yakın","Geniş","Uzun","Derin"],"a":0,"e":"Uzak ↔ yakın."},{"t":"Eş anlam","q":"\"Okul\" sözcüğünün eş anlamlısı hangisi?","o":["Mektep","Sınıf","Öğrenci","Kitap"],"a":0,"e":"Okul = mektep (eski kullanım)."},{"t":"Eş anlam","q":"\"Ak\" sözcüğünün eş anlamlısı hangisi?","o":["Beyaz","Siyah","Temiz","Açık"],"a":0,"e":"Ak = beyaz. (Kara = siyah.)"},{"t":"Eş sesli","q":"\"Yüz\" sözcüğü hangi cümlede SAYI anlamında kullanılmıştır?","o":["Yüz kişi geldi.","Denizde yüz.","Yüzünü yıka.","Kitabın yüzü yırtık."],"a":0,"e":"Aynı yazılıp farklı anlam taşıyan sözcüklere eş sesli denir. \"Yüz kişi\" sayıdır."},{"t":"Eş sesli","q":"\"Çay\" sözcüğü hangi cümlede AKARSU anlamındadır?","o":["Çay taştı, köprü yıkıldı.","Bir b // Soru seçimi (tekrarsız + aralıklı tekrar), matematik soru üreticileri, ortak ilerleme, müzik ve ses.
// Tüm oyunlar aynı tarayıcıda aynı kaydı paylaşır (localStorage 'egeOrtak.v1').
(function(){
const KEY='egeOrtak.v1';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul'}).format(new Date());
const dayNum=d=>Math.round(Date.parse(d+'T00:00:00Z')/864e5);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.v===1)return x}catch(e){}return{v:1,q:{},son:[],xp:0,seri:{gun:null,say:0},gorev:{gun:null,yapilan:0,hedef:15,odul:false},sessiz:false,toplamDogru:0}}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>n.toLocaleString('tr-TR');

// ---------- Matematik üreticileri (her seferinde yeni sayılar) ----------
function opts(correct,wrongs,n=4){
  const set=[String(correct)];
  for(const w of shuffle(wrongs)){const s=String(w);if(!set.includes(s)&&set.length<n)set.push(s)}
  return set; // doğru cevap 0. indekste; oyun seçenekleri karıştırır
}
const GEN={
  aciTuru(){const a=pick([R(10,85),90,R(95,175),180]);const t=a<90?'Dar açı':a===90?'Dik açı':a<180?'Geniş açı':'Doğru açı';
    return{t:'Açılar',q:`Ölçüsü ${a}° olan açı hangisidir?`,o:opts(t,['Dar açı','Dik açı','Geniş açı','Doğru açı']),a:0,e:'Dar < 90° · Dik = 90° · Geniş 90°–180° · Doğru = 180°'}},
  ucgenAci(){const x=R(25,80),y=R(25,170-x-10),z=180-x-y;
    return{t:'Üçgenler',q:`Bir üçgenin iki açısı ${x}° ve ${y}°. Üçüncü açı kaç derecedir?`,o:opts(z+'°',[z+10,z-10,360-x-y,x+y].filter(v=>v>0).map(v=>v+'°')),a:0,e:`Üçgende iç açılar toplamı 180°: 180 − ${x} − ${y} = ${z}°`}},
  dortgenAci(){const a=R(60,120),b=R(60,120),c=R(60,120),d=360-a-b-c;if(d<=20||d>=180)return GEN.dortgenAci();
    return{t:'Dörtgenler',q:`Bir dörtgenin üç açısı ${a}°, ${b}° ve ${c}°. Dördüncü açı kaç derecedir?`,o:opts(d+'°',[d+10,d-10,180-a-b+c,d+20].filter(v=>v>0).map(v=>v+'°')),a:0,e:`Dörtgende iç açılar toplamı 360°: 360 − ${a} − ${b} − ${c} = ${d}°`}},
  cevre(){const a=R(3,15),b=R(2,12);if(a===b)return GEN.cevre();const c=2*(a+b);
    return{t:'Çevre',q:`Kenarları ${a} cm ve ${b} cm olan dikdörtgenin çevresi kaç cm'dir?`,o:opts(c,[a*b,a+b,c+2,c-2]),a:0,e:`Çevre = 2 × (${a} + ${b}) = ${c} cm`}},
  alan(){const a=R(3,15),b=R(2,12);if(a===b)return GEN.alan();const s=a*b;
    return{t:'Alan',q:`Kenarları ${a} cm ve ${b} cm olan dikdörtgenin alanı kaç cm²'dir?`,o:opts(s,[2*(a+b),a+b,s+a,s-b]),a:0,e:`Alan = ${a} × ${b} = ${s} cm²`}},
  basamak(){const n=R(1000000,9999999);const s=String(n);const i=R(0,5);const d=+s[i];if(d===0)return GEN.basamak();
    const names=['milyonlar','yüz binler','on binler','binler','yüzler','onlar'];const val=d*10**(6-i);
    return{t:'Basamak değeri',q:`${fmt(n)} sayısında ${names[i]} basamağındaki ${d} rakamının basamak değeri nedir?`,o:opts(fmt(val),[fmt(val*10),fmt(val/10),String(d),fmt(d*10**(5-i))].filter(v=>v!=='0')),a:0,e:`${d} × ${fmt(10**(6-i))} = ${fmt(val)}`}},
  yuvarla(){const n=R(10000,99999);const r=Math.round(n/1000)*1000;
    return{t:'Yuvarlama',q:`${fmt(n)} sayısı en yakın bine yuvarlanırsa kaç olur?`,o:opts(fmt(r),[fmt(r+1000),fmt(r-1000),fmt(Math.round(n/100)*100),fmt(Math.floor(n/10000)*10000)]),a:0,e:`Yüzler basamağına bakılır: ${String(n).slice(-3,-2)} ${+String(n).slice(-3,-2)>=5?'≥ 5 → yukarı':'< 5 → aşağı'} yuvarlanır.`}},
  oncelik(){const a=R(2,20),b=R(2,9),c=R(2,9);const r=a+b*c;
    return{t:'İşlem önceliği',q:`${a} + ${b} × ${c} = ?`,o:opts(r,[(a+b)*c,a*b+c,r+1,r-1]),a:0,e:`Önce çarpma: ${b} × ${c} = ${b*c}, sonra ${a} + ${b*c} = ${r}`}},
  kesirSayi(){const p=pick([2,3,4,5,6,8,10]);const k=R(1,p-1);const t=p*R(2,9);const r=t/p*k;
    return{t:'Kesirler',q:`${t} sayısının ${k}/${p} kadarı kaçtır?`,o:opts(r,[t/p,r+t/p,t-r,k*p,r+1,r*2,r+k+1]),a:0,e:`${t} ÷ ${p} = ${t/p}, × ${k} = ${r}`}},
  carpma(){const a=R(12,99),b=R(3,9);const r=a*b;
    return{t:'Çarpma',q:`${a} × ${b} = ?`,o:opts(r,[r+b,r-a,r+10,a*(b+1)]),a:0,e:`${a} × ${b} = ${r}`}},
  bolme(){const b=R(3,9),q=R(12,99);const a=b*q;
    return{t:'Bölme',q:`${a} ÷ ${b} = ?`,o:opts(q,[q+1,q-1,q+10,b*2]),a:0,e:`${q} × ${b} = ${a}, yani ${a} ÷ ${b} = ${q}`}},
  ucgenKenar(){const t=pick(['e','i','c']);let s;
    if(t==='e'){const x=R(3,12);s=[x,x,x]}else if(t==='i'){const x=R(3,12);let y=R(2,12);if(y===x)y++;if(y>=2*x)y=x+1;s=[x,x,y]}else{const x=R(3,8);s=[x,x+R(1,3),x+R(4,6)];if(s[2]>=s[0]+s[1])return GEN.ucgenKenar()}
    const n={e:'Eşkenar',i:'İkizkenar',c:'Çeşitkenar'}[t];
    return{t:'Üçgenler',q:`Kenarları ${shuffle(s).join(' cm, ')} cm olan üçgen hangisidir?`,o:opts(n,['Eşkenar','İkizkenar','Çeşitkenar']),a:0,e:'Eşkenar: 3 kenar eşit · İkizkenar: 2 kenar eşit · Çeşitkenar: hepsi farklı'}},
  cokgen(){const c=pick([[3,'Üçgen'],[4,'Dörtgen'],[5,'Beşgen'],[6,'Altıgen'],[8,'Sekizgen']]);
    return{t:'Çokgenler',q:`${c[1]}in kaç kenarı vardır?`,o:opts(c[0],[c[0]+1,c[0]-1,c[0]+2]),a:0,e:`${c[1]}: ${c[0]} kenar, ${c[0]} köşe.`}},
};
const GEN_KEYS=Object.keys(GEN);
function uret(){const k=pick(GEN_KEYS);const q=GEN[k]();q.id='gen:'+k;q.gen=true;return q}

// ---------- Soru seçimi ----------
const ARALIK=[0,1,3,7,21]; // Leitner kutuları (gün)
const hash=t=>{let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return h.toString(36)};
function bank(legId){const L=(window.LEGS||[]).find(l=>l.id===legId);if(!L)return[];return L.qs.map(q=>({...q,id:q.id||legId+':'+hash(q.q)}))}
function oncelik(q,now){
  const st=S.q[q.id];const recent=S.son.indexOf(q.id); // son görülenler listesinde ne kadar yakın
  if(!st)return 50+Math.random()*10;                  // hiç görülmemiş
  const due=dayNum(st.son)+ARALIK[Math.min(st.kutu,4)]<=now;
  let p=due?(st.kutu===0?80:40):5;                     // vakti gelmiş yanlışlar en önde
  if(recent>=0&&recent<40)p-=60-recent;               // yakın zamanda sorulanı geriye at
  return p+Math.random()*5;
}
function sec(legId,n=10,maxOpt=4){
  const now=dayNum(today());
  let pool=bank(legId).map(q=>({q,p:oncelik(q,now)})).sort((a,b)=>b.p-a.p).map(x=>x.q);
  const L=(window.LEGS||[]).find(l=>l.id===legId);
  let out=pool.slice(0,n);
  if(L&&L.gen){const g=Math.round(n*0.4);out=out.slice(0,n-g);for(let i=0;i<g;i++)out.push(uret())}
  return shuffle(out).map(q=>kirp(q,maxOpt));
}
function kirp(q,max){ // seçenek sayısını azaltır, doğru cevabı korur
  if(q.o.length<=max)return q;
  const wrong=shuffle(q.o.map((t,i)=>i).filter(i=>i!==q.a)).slice(0,max-1);
  const keep=shuffle([q.a,...wrong]);
  return{...q,o:keep.map(i=>q.o[i]),a:keep.indexOf(q.a)};
}
function kaydet(q,dogru,ilkDeneme=true){
  if(!q.gen){
    const st=S.q[q.id]||(S.q[q.id]={kutu:0,son:today(),d:0,y:0});
    st.son=today();if(dogru){st.d++;if(ilkDeneme)st.kutu=Math.min(4,st.kutu+1)}else{st.y++;st.kutu=0}
    S.son=[q.id,...S.son.filter(x=>x!==q.id)].slice(0,120);
  }
  if(dogru){S.toplamDogru++;gorevSay()}
  save();
}

// ---------- İlerleme ----------
const RUTBE=['Çırak Pilot','Yardımcı Pilot','Kaptan','Filo Komutanı','As Pilot','Gökyüzü Efsanesi'];
const seviye=()=>1+Math.floor(S.xp/150);
function xp(n){const once=seviye();S.xp+=Math.max(0,Math.round(n));seriGuncelle();save();return seviye()>once}
function seriGuncelle(){const t=today();if(S.seri.gun===t)return;const d=S.seri.gun?dayNum(t)-dayNum(S.seri.gun):99;S.seri.say=d===1?S.seri.say+1:1;S.seri.gun=t}
function gorevSay(){const t=today();if(S.gorev.gun!==t)S.gorev={gun:t,yapilan:0,hedef:15,odul:false};S.gorev.yapilan++;
  if(!S.gorev.odul&&S.gorev.yapilan>=S.gorev.hedef){S.gorev.odul=true;S.xp+=100;Ortak.olay&&Ortak.olay('gorev')}}
function durum(){const t=today();const g=S.gorev.gun===t?S.gorev:{yapilan:0,hedef:15,odul:false};
  const l=seviye();return{xp:S.xp,seviye:l,rutbe:RUTBE[Math.min(l-1,RUTBE.length-1)],ilerleme:(S.xp%150)/150,seri:S.seri.gun&&dayNum(t)-dayNum(S.seri.gun)<=1?S.seri.say:0,gorev:g,toplamDogru:S.toplamDogru}}
function ozetHTML(){const d=durum();return `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:14px">
  <span style="background:#10223f;color:#ffc23d;border-radius:99px;padding:4px 10px">Sv ${d.seviye} · ${d.rutbe}</span>
  <span style="background:#ff7a3d;color:#fff;border-radius:99px;padding:4px 10px">🔥 ${d.seri} gün seri</span>
  <span style="background:${d.gorev.odul?'#1fa35b':'#3b82f6'};color:#fff;border-radius:99px;padding:4px 10px">🎯 Günlük görev ${Math.min(d.gorev.yapilan,d.gorev.hedef)}/${d.gorev.hedef}${d.gorev.odul?' ✓':''}</span></div>`}

// ---------- Ses ve müzik (WebAudio, dosya yok) ----------
let ctx=null,master=null,muzikT=null;
function ac(){try{if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=S.sessiz?0:1;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume()}catch(e){}return ctx}
function nota(f,t,d,tip='square',v=.08){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=tip;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.02)}
function davul(t,tip){if(!ctx)return;const len=tip==='k'?.18:.06;const b=ctx.createBuffer(1,ctx.sampleRate*len,ctx.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(tip==='k'?Math.sin(i/ctx.sampleRate*2*Math.PI*(120-i/d.length*80)):Math.random()*2-1)*(1-i/d.length);
  const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=b;g.gain.value=tip==='k'?.35:.06;s.connect(g).connect(master);s.start(t)}
const hz=m=>440*2**((m-69)/12);

  uzay:{bpm:96,kok:[62,58,60,57],mel:[0,2,3,7,9,12]},
};
function muzik(tema='gok'){ac();if(!ctx)return;muzikDur();const T=TEMALAR[tema]||TEMALAR.gok;const adim=60/T.bpm/2;let n=0;let t0=ctx.currentTime+.1;
  let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647; // tekrar eden ama akılda kalan melodi
  const melodi=Array.from({length:32},()=>rnd()<.7?T.mel[Math.floor(rnd()*T.mel.length)]:null);
  const zamanla=()=>{while(t0<ctx.currentTime+.6){const bar=Math.floor(n/8)%4,s=n%8;const kok=T.kok[bar];
      if(s%4===0)davul(t0,'k');if(s%4===2)davul(t0,'h');
      if(s%2===0)nota(hz(kok-24),t0,adim*1.8,'triangle',.12);
      const m=melodi[n%32];if(m!==null)nota(hz(kok+m+(bar%2?0:12)),t0,adim*.9,'square',.035);
      n++;t0+=adim}};
  zamanla();muzikT=setInterval(zamanla,200)}
function muzikDur(){clearInterval(muzikT);muzikT=null}
const SES={
  dogru(){ac();const t=ctx&&ctx.currentTime;[784,988,1319].forEach((f,i)=>nota(f,t+i*.07,.15,'square',.07))},
  yanlis(){ac();const t=ctx&&ctx.currentTime;nota(220,t,.25,'sawtooth',.08);nota(165,t+.12,.3,'sawtooth',.08)},
  altin(){ac();const t=ctx&&ctx.currentTime;nota(1319,t,.06,'square',.05);nota(1760,t+.05,.1,'square',.05)},
  zafer(){ac();const t=ctx&&ctx.currentTime;[523,659,784,1047,784,1047,1319].forEach((f,i)=>nota(f,t+i*.11,.2,'square',.07))},
  zipla(){ac();const t=ctx&&ctx.currentTime;if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(700,t+.15);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(master);o.start(t);o.stop(t+.2)},
};
function sessiz(v){if(v===undefined)return S.sessiz;S.sessiz=v;save();if(master)master.gain.value=v?0:1}

window.Ortak={sec,kirp,kaydet,uret,xp,durum,ozetHTML,muzik,muzikDur,SES,sessiz,ac,bugun:today,olay:null};
})();


// ===== DURUM =====
const KEY='pilotEge.v1';
let save={stars:{}};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.stars) save=s; }catch(e){}
function store(){ try{ localStorage.setItem(KEY,JSON.stringify(save)); }catch(e){} }

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ===== SES =====
let actx=null;
function beep(freqs,dur=.12,type='triangle'){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    let t=actx.currentTime;
    freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur);t+=dur*.9;});
  }catch(e){}
}
const sOk=()=>beep([660,880,1175]); const sBad=()=>beep([220,180],.18,'sawtooth'); const sWin=()=>beep([523,659,784,1047,1319],.14);

// ===== ARKA PLAN =====
(function deco(){
  const c=$('clouds');
  for(let i=0;i<6;i++){const d=document.createElement('div');d.className='cloud';const w=80+Math.random()*120;
    d.style.cssText=`width:${w}px;height:${w*.35}px;top:${8+Math.random()*80}%;animation-duration:${25+Math.random()*30}s;animation-delay:${-Math.random()*40}s`;c.appendChild(d);}
  const s=$('stars');
  for(let i=0;i<70;i++){const d=document.createElement('div');d.className='star';d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2}s`;s.appendChild(d);}
})();

const PLANE=`<g><path d="M6 25 L18 9 L24 9 L20 23 Z" fill="#e2463b"/><ellipse cx="38" cy="26" rx="34" ry="8" fill="#fff" stroke="#10223f" stroke-width="2"/>
<path d="M30 26 L44 42 L52 42 L46 26 Z" fill="#1c4f9c"/><path d="M30 26 L42 12 L49 12 L45 26 Z" fill="#3b8fe0"/>
<circle cx="56" cy="24" r="2.6" fill="#3b8fe0"/><circle cx="48" cy="24" r="2.6" fill="#3b8fe0"/><circle cx="40" cy="24" r="2.6" fill="#3b8fe0"/>
<path d="M66 22 Q73 25 66 30 Z" fill="#a9dcff" stroke="#10223f" stroke-width="1.5"/></g>`;
const ROCKET=`<g><path d="M8 18 L0 12 L4 23 L0 34 L8 28 Z" fill="#ffc23d"/><path d="M10 15 L52 15 Q70 23 52 31 L10 31 Z" fill="#fff" stroke="#10223f" stroke-width="2"/>
<path d="M14 15 L6 5 L22 15 Z M14 31 L6 41 L22 31 Z" fill="#e2463b"/><circle cx="44" cy="23" r="5" fill="#a9dcff" stroke="#10223f" stroke-width="2"/></g>`;

// ===== HARİTA =====
function unlocked(i){ return i===0 || (save.stars[LEGS[i-1].id]||0)>0; }
function renderMap(){
  document.body.classList.remove('space');
  const box=$('legs'); box.innerHTML='';
  LEGS.forEach((L,i)=>{
    const b=document.createElement('button'); const open=unlocked(i); const st=save.stars[L.id]||0;
    b.className='leg'+(open?'':' locked');
    b.innerHTML=`<div class="ico">${open?L.icon:'🔒'}</div><div><div class="t">${L.title}</div><div class="d">${L.ders} · 10 soru / uçuş</div>${st?'<span class="badge">Damga alındı</span>':''}</div><div class="st">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>`;
    b.onclick=()=>{ if(open) startLeg(i); else { b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:250}); } };
    box.appendChild(b);
  });
  const total=LEGS.reduce((s,L)=>s+(save.stars[L.id]||0),0);
  $('passport').textContent = total ? `Pasaport: ${total} / ${LEGS.length*3} yıldız` : 'İlk uçuşunu yap, pasaportun dolmaya başlasın!';
  show('map');
}
function show(id){ ['map','flight','done'].forEach(s=>$(s).classList.toggle('hidden',s!==id)); window.scrollTo(0,0); }

// ===== UÇUŞ =====
let R=null;
function startLeg(i){
  const L=LEGS[i];
  const sel=Ortak.sec(L.id,10,4).map((q,idx)=>({...q,idx}));
  R={L, sel, n:sel.length, queue:sel.slice(), correct:new Set(), firstTry:0, missed:new Set(), tried:new Set(), streak:0};
  document.body.classList.toggle('space', L.vehicle==='rocket');
  $('legTitle').textContent=L.ders; $('cityA').textContent=L.from; $('cityB').textContent=L.to;
  $('plane').innerHTML = L.vehicle==='rocket'?ROCKET:PLANE;
  $('combo').textContent='';
  show('flight'); movePlane(); ask();
}
function movePlane(){
  const p=R.correct.size/R.n;
  $('plane').style.left=`calc(${p*100}% - ${p*76}px + ${(1-p)*20}px)`;
  $('fuel').textContent=`${R.correct.size}/${R.n} ✅`;
}
function ask(){
  const Q=R.queue[0];
  $('qTopic').textContent=Q.t; $('qCount').textContent=`Kalan: ${R.queue.length}`;
  $('qText').textContent=Q.q; $('fb').innerHTML=''; $('nextBtn').classList.add('hidden');
  const box=$('opts'); box.innerHTML='';
  shuffle(Q.o.map((text,k)=>({text,k}))).forEach(({text,k})=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=text;
    b.onclick=()=>answer(k,b); box.appendChild(b);
  });
}
function answer(k,btn){
  const Q=R.queue[0]; const ok=k===Q.a; const first=!R.tried.has(Q.idx); R.tried.add(Q.idx);
  Ortak.kaydet(Q,ok,first);
  [...$('opts').children].forEach(b=>b.disabled=true);
  if(ok){
    btn.classList.add('right'); sOk(); R.correct.add(Q.idx); if(first) R.firstTry++;
    R.streak++; R.queue.shift();
    $('fb').innerHTML=`<div class="fb ok"><b>${pick(['Harika, kaptan!','Tam isabet!','Süper uçuş!','Doğru rota!'])}</b>${Q.e}</div>`;
    $('combo').textContent = R.streak>=3 ? `🔥 ${R.streak} doğru üst üste! Rüzgâr arkanda!` : '';
    movePlane();
  }else{
    btn.classList.add('wrong'); sBad(); R.missed.add(Q.idx); R.streak=0;
    [...$('opts').children].forEach(b=>{ if(b.textContent===Q.o[Q.a]) b.classList.add('right'); });
    const plane=$('plane'); plane.classList.remove('bob','shake'); void plane.offsetWidth; plane.classList.add('shake');
    setTimeout(()=>{plane.classList.remove('shake');plane.classList.add('bob')},650);
    $('fb').innerHTML=`<div class="fb no"><b>Türbülans! 🌪️</b>${Q.e}<br><span class="small">Bu soru rotanın sonunda tekrar gelecek.</span></div>`;
    $('combo').textContent='';
    R.queue.push(R.queue.shift());
  }
  $('nextBtn').classList.remove('hidden');
  $('nextBtn').textContent = R.queue.length? 'Devam ✈️' : 'İniş yap 🛬';
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
$('nextBtn').onclick=()=>{ R.queue.length? ask() : land(); };

function land(){
  const n=R.n, rate=R.firstTry/n; Ortak.xp(R.firstTry*15);
  const st= rate>=.9?3: rate>=.7?2:1;
  save.stars[R.L.id]=Math.max(save.stars[R.L.id]||0,st); store();
  sWin(); confetti();
  $('stamp').innerHTML=`${R.L.to.toUpperCase()}<br>✔<br>${new Date().toLocaleDateString('tr-TR')}`;
  $('stars3').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  $('doneTitle').textContent = R.L.vehicle==='rocket' ? 'Ay\'a indin, astronot Ege! 🌙' : `${R.L.to}'a indin, kaptan!`;
  $('doneText').textContent=`${n} sorunun ${R.firstTry} tanesini ilk denemede bildin. ${st<3?'3 yıldız için bu rotayı tekrar uçabilirsin.':'Mükemmel uçuş!'}`;
  const m=[...R.missed].map(i=>R.sel[i]);
  $('doneReview').innerHTML = m.length ? `<div class="review"><b>Tekrar et:</b><ul>${m.map(q=>`<li>${q.t}: ${q.o[q.a]}</li>`).join('')}</ul></div>` : '';
  show('done');
}
function confetti(){
  const cols=['#ffc23d','#e2463b','#1fa35b','#3b8fe0','#fff'];
  for(let i=0;i<60;i++){const d=document.createElement('div');d.className='confetti';
    d.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%5]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.4}s`;
    document.body.appendChild(d); setTimeout(()=>d.remove(),3600);}
}
$('back').onclick=renderMap; $('toMap').onclick=renderMap;
let resetArmed=false;
$('reset').onclick=()=>{ if(!resetArmed){resetArmed=true;$('reset').textContent='Emin misin? Tekrar dokun';setTimeout(()=>{resetArmed=false;$('reset').textContent='İlerlemeyi sıfırla'},3000);return;}
  save={stars:{}}; store(); resetArmed=false; $('reset').textContent='İlerlemeyi sıfırla'; renderMap(); };
renderMap();
</script>
